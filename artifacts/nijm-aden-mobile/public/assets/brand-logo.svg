<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Titanium Silver Chrome Gradients for 'نجم' -->
    <linearGradient id="titaniumSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.8" />
    </linearGradient>

    <!-- Champagne Gold Gradients for 'عدن' and Accents -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#E5B869" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997316" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF7D6" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="starRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#E5B869" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Transparent / Seamless Base Canvas -->
  <g id="brand-logo-mark">
    <!-- 1. Glowing 4-Point Gold Star ✨ (Top Right above 'نجم') -->
    <g class="brand-star" transform="translate(425, 130)">
      <!-- Radial Aura -->
      <circle cx="0" cy="0" r="38" fill="url(#starRadial)" opacity="0.6" filter="url(#starGlow)" />
      
      <!-- Primary 4-pointed Diamond Star -->
      <path d="M 0,-50 Q 0,0 50,0 Q 0,0 0,50 Q 0,0 -50,0 Q 0,0 0,-50 Z" 
            fill="url(#champagneGold)" />
      <path d="M 0,-42 Q 0,0 42,0 Q 0,0 0,42 Q 0,0 -42,0 Q 0,0 0,-42 Z" 
            fill="#FFFBEB" opacity="0.9" />

      <!-- Secondary Diagonal 4-pointed Mini Star -->
      <path d="M -18,-18 Q 0,0 18,-18 Q 0,0 18,18 Q 0,0 -18,18 Q 0,0 -18,-18 Z" 
            fill="#E5B869" opacity="0.75" />
      
      <!-- Center Bright Core -->
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
    </g>

    <!-- 2. The Main Geometric Word 'نجم' in Metallic Titanium Silver -->
    <g transform="translate(25, 140)">
      <!-- Background shadow for depth -->
      <path d="M 75,120 L 115,35 C 120,25 130,20 142,20 L 440,20 C 455,20 465,32 462,47 L 442,120 Z" 
            fill="#05070A" opacity="0.5" transform="translate(0, 4)" />

      <!-- Main Titanium Silver Shape with Chamfered Modern Tech Contour -->
      <!-- Outer Stroke Path for 'نـجـم' -->
      <path d="M 20,120 L 80,18 C 88,6 102,0 118,0 L 440,0 C 458,0 472,14 472,32 C 472,42 466,51 458,56 L 436,92 C 430,102 418,108 406,108 L 140,108 L 132,120 Z"
            fill="url(#titaniumSilver)" 
            stroke="#CBD5E1" 
            stroke-width="1.5" />

      <!-- Chamfer Highlight Bevel Top Ridge -->
      <path d="M 80,18 L 118,2 L 440,2 C 456,2 468,14 468,30 L 452,56 L 436,92 L 406,106 L 140,106"
            fill="none" 
            stroke="url(#silverHighlight)" 
            stroke-width="3" />

      <!-- Inner Cutout in 'نجم' creating the distinct negative space -->
      <path d="M 125,75 L 145,36 C 148,30 155,26 162,26 L 395,26 C 405,26 412,32 410,40 L 398,75 Z"
            fill="#0A0D14" />

      <!-- Gold Accent Wedge Slice inside the first stroke of 'ن' -->
      <path d="M 52,118 L 88,52 L 108,52 L 72,118 Z"
            fill="url(#champagneGold)" 
            stroke="#FFF3C4" 
            stroke-width="0.5" />
    </g>

    <!-- 3. The Calligraphic Word 'عدن' in Rich Champagne Gold -->
    <g transform="translate(100, 270)">
      <!-- Drop Shadow for Gold 'عدن' -->
      <path d="M 285,75 C 270,115 220,135 150,135 C 75,135 25,95 25,35 C 25,20 32,8 48,8 C 62,8 68,18 68,32 C 68,75 105,105 160,105 C 215,105 245,85 255,60 C 260,48 272,42 282,48 C 290,52 292,65 285,75 Z"
            fill="#05070A" opacity="0.6" transform="translate(0, 3)" />

      <!-- Letter 'ع' & 'د' & 'ن' Fluid Loop in Metallic Gold -->
      <path d="M 285,75 C 270,115 220,135 150,135 C 75,135 25,95 25,35 C 25,20 32,8 48,8 C 62,8 68,18 68,32 C 68,75 105,105 160,105 C 215,105 245,85 255,60 C 260,48 272,42 282,48 C 290,52 292,65 285,75 Z"
            fill="url(#champagneGold)" 
            stroke="#FFFBEB" 
            stroke-width="1" />

      <!-- Letter 'ع' Crest -->
      <path d="M 292,35 C 292,15 275,0 250,0 C 220,0 205,18 205,32 C 205,42 215,50 225,50 C 235,50 240,42 245,35 C 250,28 260,22 270,22 C 280,22 285,28 285,35 C 285,42 280,48 270,52 L 255,60"
            fill="none" 
            stroke="url(#champagneGold)" 
            stroke-width="18" 
            stroke-linecap="round" />

      <!-- Polished Titanium Silver Dot for 'ن' in 'عدن' -->
      <circle cx="205" cy="55" r="11" fill="url(#titaniumSilver)" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="203" cy="53" r="3.5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- 4. Subtitle 'مـبـايـل' in Titanium Silver with Lateral Whiskers -->
    <g transform="translate(0, 420)">
      <!-- Right Lateral Horizontal Accent Line (Whisker) -->
      <path d="M 80,10 L 175,10" stroke="url(#titaniumSilver)" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="80" cy="10" r="2.5" fill="#D4AF37" />

      <!-- Left Lateral Horizontal Accent Line (Whisker) -->
      <path d="M 325,10 L 420,10" stroke="url(#titaniumSilver)" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="420" cy="10" r="2.5" fill="#D4AF37" />

      <!-- Arabic word 'مبايل' Typography -->
      <text x="250" y="16" 
            font-family="'Cairo', 'Tajawal', sans-serif" 
            font-size="28" 
            font-weight="800" 
            letter-spacing="5"
            text-anchor="middle" 
            fill="url(#titaniumSilver)">
        مـبـايـل
      </text>
    </g>
  </g>
</svg>
